<footer class="app-footer">
  <div class="footer-container">
    <div class="footer-brand">
      <div class="brand-badge">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        <span>مركز زود</span>
      </div>
    </div>

    <!-- Required Developer Attribution -->
    <div class="developer-attribution" dir="ltr">
      <a [href]="portfolioUrl" target="_blank" rel="noopener noreferrer" class="attribution-link" title="معرض أعمال المهندس محمد خالد">
        <span class="attribution-text">designed with Eng.Mohamed Khaled</span>
        <img src="assets/eng-mohamed-khaled.png" alt="Eng. Mohamed Khaled Logo" class="developer-logo" />
      </a>

      <!-- Phone Number Under Logo - Ready to Copy -->
      <div class="phone-container">
        <button 
          type="button" 
          class="phone-copy-pill" 
          (click)="copyPhone()" 
          title="اضغط لنسخ رقم الهاتف"
          aria-label="نسخ رقم الهاتف 01024891448">
          <span class="phone-digits">{{ phoneNumber }}</span>
          @if (isCopied()) {
            <span class="copied-badge">تم النسخ ✓</span>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="copy-svg">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          }
        </button>
      </div>
    </div>

    <div class="footer-bottom">
      <p>© {{ '2026' }} مركز زود</p>
    </div>
  </div>
</footer>
