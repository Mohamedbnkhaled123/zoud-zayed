<div class="auth-overlay" (click)="onDismiss()">
  <div class="auth-dialog-card" (click)="$event.stopPropagation()">
    <!-- Modal Top Header -->
    <div class="auth-top">
      <div class="auth-logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h2 class="auth-heading">تسجيل الدخول</h2>

      <button type="button" class="btn-close-auth" (click)="onDismiss()" title="إغلاق">&times;</button>
    </div>

    <div class="auth-body">
      @if (authService.currentUser(); as user) {
        <div class="current-session-banner">
          <div class="session-user-details">
            <span class="session-lbl">الحساب الحالي:</span>
            <strong class="session-user-name">{{ user.name }}</strong>
          </div>
          <button type="button" class="btn btn-outline btn-sm text-danger logout-btn" (click)="handleLogout()">
            تسجيل الخروج
          </button>
        </div>
      }

      <div class="field-wrap">
        <label class="field-label">الاسم:</label>
        <div class="input-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="input-icon">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input
            type="text"
            class="form-control"
            placeholder="الاسم"
            [ngModel]="nameInput()"
            (ngModelChange)="onNameChange($event)" />
        </div>
      </div>

      <!-- Password Field -->
      <div class="field-wrap">
        <label class="field-label">كلمة المرور:</label>
        <div class="input-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="input-icon">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            type="password"
            class="form-control"
            placeholder="كلمة المرور"
            [ngModel]="passwordInput()"
            (ngModelChange)="passwordInput.set($event)"
            (keyup.enter)="handleLogin()" />
        </div>
      </div>

      @if (errorMessage()) {
        <div class="error-banner">
          {{ errorMessage() }}
        </div>
      }

      <button 
        type="button" 
        class="btn btn-primary btn-block" 
        (click)="handleLogin()">
        تسجيل الدخول
      </button>
    </div>
  </div>
</div>
