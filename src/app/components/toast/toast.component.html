<div class="toast-wrapper" aria-live="polite" aria-atomic="true">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="toast-card toast-{{ toast.type }}" 
      [class.toast-exiting]="toast.isExiting"
      role="alert">
      <div class="toast-icon-wrap">
        @if (toast.type === 'success') {
          <svg class="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        } @else if (toast.type === 'error') {
          <svg class="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        } @else {
          <svg class="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        }
      </div>

      <div class="toast-content">
        @if (toast.title) {
          <div class="toast-header-row">
            <h4 class="toast-title">{{ toast.title }}</h4>
            @if (toast.dateStr) {
              <span class="toast-date-tag">{{ toast.dateStr }}</span>
            }
          </div>
        }
        <p class="toast-body">{{ toast.message }}</p>
      </div>

      <button type="button" class="toast-close" (click)="toastService.dismiss(toast.id)" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  }
</div>
